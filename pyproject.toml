[project]
name = "clem"
version = "0.1.0"
description = "Read-only JSON CLI for the CLEM / Espace Citoyens (Thoiry) portal"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "typer>=0.12", "pydantic>=2", "rich>=13"]

[project.scripts]
clem = "clem.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clem"]
